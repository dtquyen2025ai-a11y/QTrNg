# Render Blueprint: New > Blueprint > chọn repo này. Render tạo web service + PostgreSQL.
services:
  - type: web
    name: tam-an-online
    runtime: docker
    plan: starter            # gói free sẽ ngủ sau 15 phút không truy cập, làm rớt WebSocket
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: tam-an-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false          # Render hỏi giá trị khi tạo
databases:
  - name: tam-an-db
    databaseName: chua
    plan: basic-256mb
